[mongo]
    dbName = "layout"
    addr = "127.0.0.1:27017"
    dsn = "mongodb://root:123456@127.0.0.1:27017/?connect=direct"
    #specifies that maximum number of connections allowed in the driver's connection pool to each server.
    maxPoolSize = 100
    #specifies the minimum number of connections allowed in the driver's connection pool to each server. If
    minPoolSize = 50
    slowQueryDuration = "250ms"

[redis]
    dbName = "layout"
    dbIndex = 0
    addr = ["127.0.0.1:6379"]
    password = "layout"
    deployMode = "node"
    maxIdle = 5
    maxActive = 10
    dialTimeout = "1s"
    readTimeout = "1s"
    writeTimeout = "1s"
    idleTimeout = "10s"
    slowOpTimeout = "100ms"

[log]
    name = "layout.log"
    dir = "./"
    addCaller = true
    level = "debug"
    callerSkip = 1
    flushInterval= "1s"
    debug = true
    enableAsyncLog = true
    disableStacktrace = true
    maxSize = 50 # maximum 500M log size
    maxAge = 30 # retain maximum 30 days
    maxBackup = 100 # retian maximum 100 log
    watchConfig = true

[trace]
    [trace.jaeger]
        serviceName = "layout"
        enableRPCMetrics = true
        # sampler config
        samplerType = "const"
        samplerParam = 1
        # report config
        agentAddr = "127.0.0.1:6831"
        reporterLogSpans = false
        reporterBufferFlushInterval = "2s"
        # option config
        maxTagValueLength = 5120

[etcd]
    prefix = "layout"
    endpoints = ["127.0.0.1:2379"]
    dialTimeout = "1s"
    registerTTL = "90s"
    username = ""
    password = ""
